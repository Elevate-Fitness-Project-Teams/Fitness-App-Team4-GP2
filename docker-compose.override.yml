      - "ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ElevateProgressDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Elevate_Str0ng_Pass1};TrustServerCertificate=True;MultipleActiveResultSets=true"
