services:
  authservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      # Points at the sqlserver container; the service migrates/seeds this DB on startup.
      - "ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ElevateAuthDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Elevate_Str0ng_Pass1};TrustServerCertificate=True;MultipleActiveResultSets=true"
      # RabbitMQ runs on the Windows host, not in this compose file.
      - RabbitMQ__Host=host.docker.internal
    ports:
      - "5000:8080"
      - "5001:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  fceservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      # Points at the sqlserver container; the service migrates/seeds this DB on startup.
      - "ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ElevateFceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Elevate_Str0ng_Pass1};TrustServerCertificate=True;MultipleActiveResultSets=true"
      - RabbitMQ__Host=host.docker.internal
    ports:
      - "5002:8080"
      - "5003:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro 
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  notificationservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      # Points at the sqlserver container; the service migrates/seeds this DB on startup.
      - "ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ElevateNotificationDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Elevate_Str0ng_Pass1};TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "5004:8080"
      - "5005:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  nutritionservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      # Points at the sqlserver container; the service migrates/seeds this DB on startup.
      - "ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ElevateNutritionDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Elevate_Str0ng_Pass1};TrustServerCertificate=True;MultipleActiveResultSets=true"
      - RabbitMQ__Host=host.docker.internal
      # Nutrition calls FCE for fitness metrics; without this it falls back to the
      # appsettings.Development value https://localhost:7244, which is nothing inside
      # the container. Container-to-container call goes over the compose network.
      - Services__Fce=http://fceservice:8080
    ports:
      - "5006:8080"
      - "5007:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  profileservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      # Points at the sqlserver container; the service migrates/seeds this DB on startup.
      - "ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ElevateProfileDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Elevate_Str0ng_Pass1};TrustServerCertificate=True;MultipleActiveResultSets=true"
      - RabbitMQ__Host=host.docker.internal
      # Container-to-container call goes through the compose network, not localhost.
      - Services__Auth=http://authservice:8080
    ports:
      - "5008:8080"
      - "5009:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  progressservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      # Points at the sqlserver container; the service migrates/seeds this DB on startup.
      - "ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ElevateProgressDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Elevate_Str0ng_Pass1};TrustServerCertificate=True;MultipleActiveResultSets=true"
      - RabbitMQ__Host=host.docker.internal
    ports:
      - "5010:8080"
      - "5011:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  smartcoachservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      # Points at the sqlserver container; the service migrates/seeds this DB on startup.
      - "ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ElevateSmartCoachDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Elevate_Str0ng_Pass1};TrustServerCertificate=True;MultipleActiveResultSets=true"
      - Services__Profile=http://profileservice:8080
      - Services__Nutrition=http://nutritionservice:8080
      - Services__Workout=http://workoutservice:8080
      - Services__Fce=http://fceservice:8080
      - Services__Progress=http://progressservice:8080
      # Redis runs as a sibling container on the compose network, not localhost.
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5012:8080"
      - "5013:8081"
    depends_on:
      - redis
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  redis:
    ports:
      - "6379:6379"

  subscriptionservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      # Points at the sqlserver container; the service migrates/seeds this DB on startup.
      - "ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ElevateSubscriptionDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Elevate_Str0ng_Pass1};TrustServerCertificate=True;MultipleActiveResultSets=true"
      - RabbitMQ__Host=host.docker.internal
    ports:
      - "5014:8080"
      - "5015:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  workoutservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      # Points at the sqlserver container; the service migrates/seeds this DB on startup.
      - "ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ElevateWorkoutDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Elevate_Str0ng_Pass1};TrustServerCertificate=True;MultipleActiveResultSets=true"
      - RabbitMQ__Host=host.docker.internal
    ports:
      - "5016:8080"
      - "5017:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  sqlserver:
    ports:
      # Exposed on the host so SSMS / Azure Data Studio / `dotnet ef` can reach it
      # at localhost,1433 (sa / Elevate_Str0ng_Pass1 unless MSSQL_SA_PASSWORD is set).
      - "1433:1433"
